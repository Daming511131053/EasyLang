<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jianyu · 写中文就能编程</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #e8e8ed;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #aeaeb2;
            --accent: #5e5ce6;
            --accent-hover: #4b49b6;
            --accent-light: #f0f0ff;
            --border: #d2d2d7;
            --border-light: #e5e5ea;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --success: #34c759;
            --warning: #ff9500;
            --error: #ff3b30;
            --highlight: rgba(255,149,0,0.3);
            --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --sidebar-width: 260px;
            --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --font-size: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-tertiary: #3a3a3c;
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --text-tertiary: #636366;
            --accent: #7d7aff;
            --accent-hover: #9b99ff;
            --accent-light: #1e1e3a;
            --border: #48484a;
            --border-light: #38383a;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
            --highlight: rgba(255,149,0,0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1c1c1e;
                --bg-secondary: #2c2c2e;
                --bg-tertiary: #3a3a3c;
                --text-primary: #f5f5f7;
                --text-secondary: #98989d;
                --text-tertiary: #636366;
                --accent: #7d7aff;
                --accent-hover: #9b99ff;
                --accent-light: #1e1e3a;
                --border: #48484a;
                --border-light: #38383a;
                --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
                --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
                --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
                --highlight: rgba(255,149,0,0.4);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-ui);
            background: var(--bg-secondary);
            color: var(--text-primary);
            display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

        .toolbar {
            height: 48px; background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
            z-index: 100; -webkit-app-region: drag; user-select: none;
        }
        .toolbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
        .toolbar-spacer { flex: 1; }
        .toolbar-btn {
            height: 30px; padding: 0 12px; border: none; border-radius: var(--radius-sm);
            background: transparent; color: var(--text-secondary); font-size: 13px;
            font-family: var(--font-ui); cursor: pointer; transition: all var(--transition);
            -webkit-app-region: no-drag; white-space: nowrap; outline: none;
        }
        .toolbar-btn:active { transform: scale(0.96); }
        .toolbar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .toolbar-btn.primary { background: var(--accent); color: #fff; font-weight: 500; }
        .toolbar-btn.primary:hover { background: var(--accent-hover); }
        .toolbar-btn.primary:active { transform: scale(0.96); }
        .toolbar-btn.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .toolbar-divider { width: 1px; height: 20px; background: var(--border-light); margin: 0 4px; }

        .settings-popup {
            position: absolute; top: 50px; right: 16px; background: var(--bg-primary);
            border: 1px solid var(--border); border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg); padding: 12px; z-index: 300;
            display: none; flex-direction: column; gap: 12px; min-width: 200px; font-size: 13px;
        }
        .settings-popup.show { display: flex; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .settings-row input[type="range"] { width: 80px; }

        .main-layout { flex: 1; display: flex; overflow: hidden; }

        .sidebar {
            width: var(--sidebar-width); background: var(--bg-primary);
            border-right: 1px solid var(--border-light); display: flex;
            flex-direction: column; overflow-y: auto; transition: width var(--transition); flex-shrink: 0;
        }
        .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
        .sidebar-section {
            padding: 12px 16px 8px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary);
        }
        .sidebar-item {
            padding: 8px 16px; margin: 1px 8px; border-radius: var(--radius-sm);
            font-size: 13px; color: var(--text-secondary); cursor: pointer;
            transition: all var(--transition); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;
        }
        .sidebar-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }

        .editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); min-width: 0; }
        .editor-header {
            height: 36px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; padding: 0 16px; font-size: 12px;
            color: var(--text-secondary); gap: 8px; user-select: none;
        }
        .editor-tab {
            padding: 6px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            cursor: pointer; font-size: 12px; background: transparent;
            border: 1px solid transparent; border-bottom: none; color: var(--text-secondary);
        }
        .editor-tab.active { background: var(--bg-primary); border-color: var(--border-light); color: var(--text-primary); }
        .editor-body { flex: 1; position: relative; overflow: hidden; }

        .lineno-area {
            position: absolute; top: 0; left: 0; width: 48px; height: 100%;
            background: var(--bg-secondary); border-right: 1px solid var(--border-light);
            padding-top: 20px; font-family: var(--font-mono); font-size: var(--font-size);
            line-height: 1.7; color: var(--text-tertiary); text-align: right;
            overflow: hidden; user-select: none; pointer-events: none;
        }
        .lineno-area span { display: block; padding-right: 10px; }
        .lineno-area span.error-line { background: var(--highlight); color: var(--error); }

        textarea {
            position: absolute; top: 0; left: 52px; width: calc(100% - 52px); height: 100%;
            border: none; outline: none; resize: none; padding: 20px;
            font-family: var(--font-mono); font-size: var(--font-size); line-height: 1.7;
            color: var(--text-primary); background: var(--bg-primary); tab-size: 4;
        }
        textarea::placeholder { color: var(--text-tertiary); font-family: var(--font-ui); }

        .status-bar {
            height: 24px; background: var(--bg-secondary); border-top: 1px solid var(--border-light);
            display: flex; align-items: center; padding: 0 16px; font-size: 11px;
            color: var(--text-tertiary); gap: 16px;
        }

        textarea::-webkit-scrollbar, .sidebar::-webkit-scrollbar, .result-content::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track, .result-content::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb, .result-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .result-panel {
            width: 380px; min-width: 200px; max-width: 600px; background: var(--bg-primary);
            border-left: 1px solid var(--border-light); display: flex; flex-direction: column;
            flex-shrink: 0; position: relative;
        }
        .result-resize-handle { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 10; }
        .result-resize-handle:hover { background: var(--accent); opacity: 0.2; }
        .result-header {
            height: 36px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light);
            display: flex; align-items: center; padding: 0 16px; font-size: 12px;
            color: var(--text-secondary); justify-content: space-between; user-select: none;
        }
        .result-content {
            flex: 1; padding: 16px; overflow-y: auto; font-family: var(--font-mono);
            font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        }
        .result-empty { color: var(--text-tertiary); text-align: center; padding-top: 60px; }
        .result-item { padding: 8px 0; border-bottom: 1px solid var(--border-light); animation: fadeIn 0.25s ease forwards; }
        .result-error { color: var(--error); background: rgba(255,59,48,0.06); padding: 10px 12px; border-radius: var(--radius-sm); border-left: 3px solid var(--error); margin: 4px 0; }
        .result-warning { color: var(--warning); background: rgba(255,149,0,0.06); padding: 10px 12px; border-radius: var(--radius-sm); border-left: 3px solid var(--warning); margin: 4px 0; }
        @keyframes fadeIn { to { opacity: 1; } }

        .ai-bar {
            display: flex; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--border-light);
            background: var(--bg-secondary);
        }
        .ai-bar input {
            flex: 1; padding: 8px 14px; border: 1px solid var(--border);
            border-radius: 20px; font-size: 13px; font-family: var(--font-ui);
            background: var(--bg-primary); color: var(--text-primary); outline: none;
        }
        .ai-bar input:focus { border-color: var(--accent); }
        .ai-bar button {
            padding: 8px 16px; border: none; border-radius: 20px; background: var(--accent);
            color: #fff; font-size: 13px; font-family: var(--font-ui); font-weight: 500;
            cursor: pointer; transition: all var(--transition); white-space: nowrap;
        }
        .ai-bar button:active { transform: scale(0.96); }
        .ai-bar button:hover { background: var(--accent-hover); }
        .ai-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-right: 6px; vertical-align: middle;
        }
        .spinner-dark { border-color: rgba(0,0,0,0.15); border-top-color: var(--accent); }

        .config-row { display: flex; gap: 8px; align-items: center; }
        .config-row input {
            padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 12px; font-family: var(--font-mono); background: var(--bg-primary);
            color: var(--text-primary); outline: none;
        }
        .config-row input:focus { border-color: var(--accent); }
        .config-row input.model-input { width: 140px; }
        .config-row input.key-input { width: 180px; }

        @media (max-width: 900px) {
            .sidebar { width: 0; border-right: none; overflow: hidden; }
            .result-panel { width: 0; border-left: none; overflow: hidden; min-width: 0; }
            .lineno-area { display: none; }
            textarea { left: 0; width: 100%; padding: 16px; }
            .toolbar { gap: 4px; padding: 0 8px; }
            .config-row input { width: 100px !important; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <span class="toolbar-title">jianyu</span>
    <span style="font-size:11px;color:var(--text-tertiary);">写中文就能编程</span>
    <span class="toolbar-spacer"></span>
    <div class="config-row">
        <input class="model-input" id="modelInput" placeholder="模型名">
        <input class="key-input" type="password" id="apiKeyInput" placeholder="API Key">
    </div>
    <button class="toolbar-btn" onclick="saveConfig()">保存</button>
    <span class="toolbar-divider"></span>
    <button class="toolbar-btn" id="themeBtn" onclick="cycleTheme()">🌓</button>
    <button class="toolbar-btn" onclick="toggleSidebar()">☰</button>
    <button class="toolbar-btn" onclick="toggleSettings()">⚙️</button>
    <button class="toolbar-btn" onclick="exportFile()">📥</button>
    <button class="toolbar-btn primary" id="runBtn" onclick="runCode()">▶ 运行</button>
</div>

<div class="settings-popup" id="settingsPopup">
    <div class="settings-row">
        <span>字体大小</span>
        <input type="range" id="fontSizeSlider" min="12" max="20" value="14" oninput="adjustFontSize(this.value)">
        <span id="fontSizeValue">14px</span>
    </div>
    <div class="settings-row">
        <span>主题</span>
        <button class="toolbar-btn" onclick="cycleTheme()">切换</button>
    </div>
    <button class="toolbar-btn" onclick="resetSettings()" style="width:100%;">重置默认</button>
</div>

<div class="main-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-section">示例库</div>
        <div class="sidebar-item active" onclick="loadExample(0)">BMI 计算器</div>
        <div class="sidebar-item" onclick="loadExample(1)">随机点名</div>
        <div class="sidebar-item" onclick="loadExample(2)">密码门</div>
        <div class="sidebar-item" onclick="loadExample(3)">倒计时器</div>
        <div class="sidebar-item" onclick="loadExample(4)">穿衣建议</div>
        <div class="sidebar-item" onclick="loadExample(5)">找零计算器</div>
        <div class="sidebar-item" onclick="loadExample(6)">抽奖转盘</div>
        <div class="sidebar-item" onclick="loadExample(7)">作业提醒</div>
        <div class="sidebar-item" onclick="loadExample(8)">猜数字游戏</div>
    </div>

    <div class="editor-area">
        <div class="editor-header"><span class="editor-tab active">main.jian</span></div>
        <div class="editor-body">
            <div class="lineno-area" id="linenoArea"></div>
            <textarea id="codeInput" placeholder="在这里输入 jianyu 代码..." oninput="onEditorInput()" onscroll="syncScroll()" onkeyup="updateCursorPos()" onclick="updateCursorPos()"></textarea>
        </div>
        <div class="status-bar">
            <span id="cursorPos">行 1, 列 1</span> |
            <span id="lineCount">共 1 行</span> |
            <span id="themeStatus">自动</span> |
            <span id="fontStatus">14px</span> |
            <span>jianyu V2.6</span>
        </div>
        <div class="ai-bar">
            <input type="text" id="aiInput" placeholder="对 AI 说：帮我写一个猜数字游戏..." onkeydown="if(event.key==='Enter')askAI()">
            <button id="aiBtn" onclick="askAI()">✨ 生成</button>
        </div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="result-resize-handle" id="resizeHandle"></div>
        <div class="result-header">
            <span>运行结果</span>
            <span id="aiStatus" style="font-size:11px;color:var(--text-tertiary);"></span>
        </div>
        <div class="result-content" id="resultArea">
            <div class="result-empty">点击 ▶ 运行 查看结果<br><span style="font-size:12px;color:var(--text-tertiary);">Ctrl + Enter</span></div>
        </div>
    </div>
</div>

<script>
// ========== 主题 ==========
const ThemeKey = 'jianyu_theme';
function applyTheme(mode){
    const html = document.documentElement;
    if(mode === 'light') html.setAttribute('data-theme','light');
    else if(mode === 'dark') html.setAttribute('data-theme','dark');
    else html.removeAttribute('data-theme');
    document.getElementById('themeStatus').textContent = mode==='auto'?'自动':(mode==='dark'?'深色':'浅色');
}
function cycleTheme(){
    let cur = localStorage.getItem(ThemeKey)||'auto';
    let next = cur==='auto'?'light':(cur==='light'?'dark':'auto');
    localStorage.setItem(ThemeKey,next);
    applyTheme(next);
}
applyTheme(localStorage.getItem(ThemeKey)||'auto');

// ========== 字体 ==========
const FontSizeKey = 'jianyu_font_size';
function adjustFontSize(size){
    size = parseInt(size);
    document.documentElement.style.setProperty('--font-size',size+'px');
    document.getElementById('fontSizeSlider').value = size;
    document.getElementById('fontSizeValue').textContent = size+'px';
    document.getElementById('fontStatus').textContent = size+'px';
    localStorage.setItem(FontSizeKey,size);
    updateLineNumbers();
}
function resetSettings(){
    adjustFontSize(14);
    applyTheme('auto');
    localStorage.setItem(ThemeKey,'auto');
    document.getElementById('settingsPopup').classList.remove('show');
}
adjustFontSize(localStorage.getItem(FontSizeKey)||14);
function toggleSettings(){ document.getElementById('settingsPopup').classList.toggle('show'); }
document.addEventListener('click',function(e){
    if(!e.target.closest('.settings-popup')&&!e.target.closest('[onclick="toggleSettings()"]'))
        document.getElementById('settingsPopup').classList.remove('show');
});

// ========== 导出 ==========
function exportFile(){
    const blob = new Blob([ta.value],{type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download='main.jian';
    a.click(); URL.revokeObjectURL(a.href);
}

// ========== 配置 & AI ==========
const API_ENDPOINTS = {
    'deepseek-chat':'https://api.deepseek.com/v1/chat/completions',
    'gpt-4o':'https://api.openai.com/v1/chat/completions',
    'glm-4':'https://open.bigmodel.cn/api/paas/v4/chat/completions',
    'qwen-plus':'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
};
let apiKey = localStorage.getItem('easylang_api_key')||'';
let model = localStorage.getItem('easylang_model')||'';
if(apiKey) document.getElementById('apiKeyInput').value = apiKey;
if(model) document.getElementById('modelInput').value = model;
function saveConfig(){
    apiKey = document.getElementById('apiKeyInput').value.trim();
    model = document.getElementById('modelInput').value.trim();
    if(apiKey) localStorage.setItem('easylang_api_key',apiKey);
    else localStorage.removeItem('easylang_api_key');
    if(model) localStorage.setItem('easylang_model',model);
    else localStorage.removeItem('easylang_model');
    updateStatus();
}
function updateStatus(){
    const s = document.getElementById('aiStatus');
    if(apiKey&&model) s.textContent = '已配置：'+model;
    else if(apiKey) s.textContent = '请填写模型名';
    else s.textContent = '配置后可 AI 生成';
}
updateStatus();

async function askAI(){
    const input = document.getElementById('aiInput');
    const btn = document.getElementById('aiBtn');
    const status = document.getElementById('aiStatus');
    const query = input.value.trim();
    if(!query) return;
    if(!apiKey||!model){ status.textContent='⚠️ 请先配置模型和Key'; return; }
    btn.disabled = input.disabled = true;
    status.innerHTML = '<span class="spinner spinner-dark"></span> 生成中...';
    try{
        const endpoint = API_ENDPOINTS[model]||'https://api.openai.com/v1/chat/completions';
        const res = await fetch(endpoint,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
            body:JSON.stringify({model,temperature:0.3,max_tokens:2000,
                messages:[
                    {role:'system',content:'你是jianyu代码生成器。只输出jianyu代码，不要解释。语法：说 "内容", 问 "提示", 得到 [变量], 设定 [变量] 为 值, 如果/再如果/都不是, 重复 N 次：, 当 条件 时，一直：, 从 [列表] 里随机选一个 得到 [变量]。'},
                    {role:'user',content:query}
                ]
            })
        });
        if(!res.ok) throw new Error((await res.json().catch(()=>({})).error?.message||'HTTP '+res.status));
        const data = await res.json();
        ta.value = data.choices[0].message.content.trim().replace(/```/g,'');
        onEditorInput(); localStorage.setItem(SAVE_KEY,ta.value);
        status.textContent = '✅ 代码已生成';
    }catch(e){ status.textContent = '❌ '+e.message; }
    finally{ btn.disabled = input.disabled = false; input.focus(); }
}

// ========== 侧边栏 ==========
function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('collapsed');
    localStorage.setItem('jianyu_sidebar_collapsed', document.getElementById('sidebar').classList.contains('collapsed')?'1':'0');
}
if(localStorage.getItem('jianyu_sidebar_collapsed')==='1') document.getElementById('sidebar').classList.add('collapsed');

// ========== 面板宽度 ==========
const panelWidthKey = 'jianyu_panel_width';
const savedPanelWidth = localStorage.getItem(panelWidthKey);
if(savedPanelWidth) document.getElementById('resultPanel').style.width = savedPanelWidth+'px';

// ========== 代码保存 ==========
const SAVE_KEY = 'jianyu_code_saved';
const ta = document.getElementById('codeInput');
if(localStorage.getItem(SAVE_KEY)) ta.value = localStorage.getItem(SAVE_KEY);
let saveTimer;
function autoSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ localStorage.setItem(SAVE_KEY,ta.value); },1000); }

// ========== 行号 ==========
function updateLineNumbers(){
    const area = document.getElementById('linenoArea');
    const lines = ta.value.split('\n');
    let html = '';
    for(let i=1;i<=lines.length;i++) html += '<span id="ln-'+i+'">'+i+'</span>';
    area.innerHTML = html;
    document.getElementById('lineCount').textContent = '共 '+lines.length+' 行';
}
function syncScroll(){ document.getElementById('linenoArea').scrollTop = ta.scrollTop; }
function updateCursorPos(){
    const pos = ta.selectionStart;
    const text = ta.value.substring(0,pos);
    const line = text.split('\n').length;
    const col = text.split('\n').pop().length+1;
    document.getElementById('cursorPos').textContent = '行 '+line+', 列 '+col;
}
function highlightErrorLine(lineNum){
    document.querySelectorAll('.lineno-area span.error-line').forEach(el=>el.classList.remove('error-line'));
    const el = document.getElementById('ln-'+lineNum);
    if(el) el.classList.add('error-line');
}

function onEditorInput(){
    updateLineNumbers();
    updateCursorPos();
    autoSave();
}

// ========== 结果面板拖拽 ==========
const resizeHandle = document.getElementById('resizeHandle');
const resultPanel = document.getElementById('resultPanel');
let startX, startWidth;
resizeHandle.addEventListener('mousedown',function(e){
    startX = e.clientX; startWidth = resultPanel.offsetWidth;
    document.addEventListener('mousemove',onMouseMove); document.addEventListener('mouseup',onMouseUp);
    e.preventDefault();
});
function onMouseMove(e){
    let w = Math.max(200,Math.min(600,startWidth - (e.clientX-startX)));
    resultPanel.style.width = w+'px';
}
function onMouseUp(){
    document.removeEventListener('mousemove',onMouseMove); document.removeEventListener('mouseup',onMouseUp);
    localStorage.setItem(panelWidthKey,parseInt(resultPanel.style.width));
}

// ========== 转译器 ==========
function cleanLine(line){
    let t = line.trim();
    if(!t) return '';
    t = t.replace(/[""]/g,'"').replace(/：/g,':').replace(/，/g,',').replace(/；/g,';').replace(/（/g,'(').replace(/）/g,')').replace(/【/g,'[').replace(/】/g,']');
    t = t.replace(/[的了吗吧呢啊呀嘛哦哈啦哟]$/g,'');
    t = t.replace(/^(请|麻烦|谢谢|拜托|帮我|能不能|可不可以|如何)\s*/g,'');
    t = t.replace(/^(然后|接着|之后|最后|首先|其次|另外|还有|接下来)\s*/g,'');
    return t.trim();
}
function fixExpression(expr){
    let e = expr.trim();
    e = e.replace(/等于/g,'===').replace(/不等于|不是/g,'!==').replace(/小于等于|不超过|不大于/g,'<=').replace(/大于等于|至少|不小于/g,'>=').replace(/小于|不到|低于/g,'<').replace(/大于|超过|高于/g,'>');
    e = e.replace(/\b真\b|\b是\b|\b对\b|\b成立\b/g,'true').replace(/\b假\b|\b否\b|\b错\b|\b不成立\b/g,'false');
    e = e.replace(/\[(.*?)\]/g,'$1');
    e = e.replace(/\s=\s/g,' === ');
    return e;
}
function identifyIntent(t){
    if(/^(说|显示|打印|输出|告诉|提示|通知)\s/.test(t)) return {intent:'output',rest:t.replace(/^(说|显示|打印|输出|告诉|提示|通知)\s/,'')};
    if(/^(问|询问|请输入|获取)\s/.test(t)) return {intent:'input',rest:t};
    if(/^(设|设定|让|令)\s/.test(t)||/把.+记作/.test(t)) return {intent:'assign',rest:t};
    if(/^(如果|假如|若是|万一|若|要是)\s/.test(t)) return {intent:'if',rest:t};
    if(/^(再如果|否则如果|另外如果|若不然|不然如果)\s/.test(t)) return {intent:'elseif',rest:t};
    if(/^(都不是|否则|不然|其他情况|除此之外|以上都不是)\s*$/.test(t)) return {intent:'else',rest:t};
    if(/^(重复|循环|做|执行).*次/.test(t)) return {intent:'loop',rest:t};
    if(/^(当|只要|在).*(时|期间).*一直/.test(t)) return {intent:'whileloop',rest:t};
    if(/^(从|随机从).*(里|中)随机/.test(t)) return {intent:'random',rest:t};
    if(/^(等|等待|暂停|延时)\s*\d/.test(t)) return {intent:'sleep',rest:t};
    if(/^(结束|退出|停止|跳出|中止)\s*$/.test(t)) return {intent:'break',rest:t};
    if(/^(注|说明|#|\/\/)/.test(t)) return {intent:'comment',rest:t};
    return null;
}
function translate(code){
    const lines = code.split('\n'), js = [], warnings = [];
    let indent = 0;
    const I = ()=> '    '.repeat(indent);
    for(let rawLine of lines){
        let line = cleanLine(rawLine);
        if(!line){ js.push(''); continue; }
        const lineNum = lines.indexOf(rawLine)+1;
        const hadColon = line.endsWith(':');
        if(hadColon) line = line.slice(0,-1);
        const identified = identifyIntent(line);
        let intent = identified?identified.intent:null;
        let t = identified?identified.rest:line;
        if((intent==='if'||intent==='elseif')&&!hadColon) warnings.push('⚠️ 第'+lineNum+'行：缺少冒号');
        if(intent==='output'){ js.push(I()+'console.log('+fixExpression(t)+');'); continue; }
        if(intent==='input'){ const m=t.match(/"([^"]+)".*得到\s*\[(.+?)\]/); if(m){ js.push(I()+m[2]+' = prompt("'+m[1]+'");'); js.push(I()+'if(!isNaN('+m[2]+')&&'+m[2]+'.trim()!=="")'+m[2]+'=Number('+m[2]+');'); } continue; }
        if(intent==='assign'){ let m=t.match(/设\s*\[(.+?)\]\s*(为|等于|是)\s*(.+)/); if(!m) m=t.match(/让\s*\[(.+?)\]\s*(等于|为|是)\s*(.+)/); if(!m) m=t.match(/把\s*\[(.+?)\]\s*记作\s*(.+)/); if(!m) m=t.match(/令\s*\[(.+?)\]\s*(为|等于|是)\s*(.+)/); if(m){ let expr=m[3].trim(); if(!(expr.startsWith('[')&&expr.includes(',')&&expr.endsWith(']'))) expr=fixExpression(expr); js.push(I()+m[1]+' = '+expr+';'); } continue; }
        if(intent==='if'){ js.push(I()+'if ('+fixExpression(t.replace(/^(如果|假如|若是|万一|若|要是)\s*/,''))+') {'); indent++; continue; }
        if(intent==='elseif'){ indent--; js.push(I()+'} else if ('+fixExpression(t.replace(/^(再如果|否则如果|另外如果|若不然|不然如果)\s*/,''))+') {'); indent++; continue; }
        if(intent==='else'){ indent--; js.push(I()+'} else {'); indent++; continue; }
        if(intent==='loop'){ const m=t.match(/(重复|循环|做|执行)\s*(\d+)\s*次/); if(m){ js.push(I()+'for (let 计数=1; 计数<='+m[2]+'; 计数++) {'); indent++; } continue; }
        if(intent==='whileloop'){ let cond=t.replace(/^(当|只要|在)\s*/,'').replace(/\s*(时|期间).*(一直|始终)/,''); cond=fixExpression(cond); js.push(I()+'while ('+cond+') {'); indent++; continue; }
        if(intent==='random'){ const m=t.match(/从\s*(.+?)\s*里随机选一个.*得到\s*\[(.+?)\]/); if(!m) m=t.match(/随机从\s*(.+?)\s*里选.*得到\s*\[(.+?)\]/); if(m){ let list=m[1].replace(/[\[\]]/g,'').trim(); const target=m[2]; if(!list.includes('"')&&!list.includes("'")&&!list.includes('[')) list='['+list+']'; js.push(I()+target+' = '+list+'[Math.floor(Math.random() * '+list.replace(/[\[\]]/g,'')+'.length)];'); } continue; }
        if(intent==='sleep'){ const m=t.match(/等\s*(\d+)\s*秒/); if(m) js.push(I()+'const _s=Date.now();while(Date.now()-_s<'+m[1]+'*1000){}'); continue; }
        if(intent==='break'){ js.push(I()+'break;'); continue; }
        if(intent==='comment'){ js.push(I()+'// '+t.replace(/^(注|说明|#|\/\/)\s*/,'')); continue; }
    }
    while(indent>0){ indent--; js.push(I()+'}'); }
    return {code:js.join('\n'), warnings};
}

// ========== 运行 ==========
function runCode(){
    const code = ta.value;
    const ra = document.getElementById('resultArea'), rb = document.getElementById('runBtn');
    ra.innerHTML = '<div class="result-empty"><span class="spinner spinner-dark"></span> 正在执行...</div>';
    rb.disabled = true; rb.innerHTML = '<span class="spinner"></span> 运行中';
    const logs = [], orig = console.log;
    console.log = function(){ logs.push(Array.prototype.slice.call(arguments).join(' ')); };
    setTimeout(()=>{
        let jsCode, warnings=[], errorLine=0;
        try{
            const r = translate(code); jsCode = r.code; warnings = r.warnings;
            new Function(jsCode)();
            if(!logs.length) logs.push('（程序运行完毕，无输出内容）');
        }catch(e){
            const lineMatch = e.stack&&e.stack.match(/at eval.*:(\d+):\d+/);
            if(lineMatch) errorLine = parseInt(lineMatch[1])-1;
            logs.push({type:'error',content:'❌ 运行出错：'+e.message});
            if(errorLine>0&&errorLine<=code.split('\n').length) highlightErrorLine(errorLine);
        }
        console.log = orig;
        ra.innerHTML = '';
        warnings.forEach(w=>{ const d=document.createElement('div'); d.className='result-warning'; d.textContent=w; ra.appendChild(d); });
        logs.forEach(l=>{
            const d=document.createElement('div');
            if(typeof l==='object'&&l.type==='error'){ d.className='result-error'; d.textContent=l.content; }
            else{ d.className='result-item'; d.textContent=l; }
            ra.appendChild(d);
        });
        rb.disabled = false; rb.innerHTML = '▶ 运行';
        localStorage.setItem(SAVE_KEY,code);
    },80);
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runCode(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='b'){ e.preventDefault(); toggleSidebar(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='/'){ e.preventDefault(); /* 注释切换略 */ }
    if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){
        e.preventDefault();
        let cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size')||'14');
        if(cur<20) adjustFontSize(cur+1);
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='-'){ e.preventDefault(); let cur=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size')||'14'); if(cur>12) adjustFontSize(cur-1); }
    if((e.ctrlKey||e.metaKey)&&e.key==='0'){ e.preventDefault(); adjustFontSize(14); }
});

// 焦点模式
document.getElementById('editorBody').addEventListener('dblclick',function(){
    const sidebar=document.getElementById('sidebar'), rp=document.getElementById('resultPanel');
    if(sidebar.classList.contains('collapsed')&&rp.style.width==='0px'){
        sidebar.classList.remove('collapsed');
        rp.style.width = savedPanelWidth||'380px';
    }else{
        sidebar.classList.add('collapsed');
        rp.style.width = '0px';
    }
});

// 初始化
window.addEventListener('load',function(){
    if(!ta.value) loadExample(0);
    updateLineNumbers();
    updateCursorPos();
});
